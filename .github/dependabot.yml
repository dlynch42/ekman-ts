version: 2
updates:
  # Actions only. Ekman ships zero runtime dependencies, and its devDependencies
  # are few enough to update deliberately; pinned action versions are the thing
  # that goes stale without anyone noticing.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release"
    labels:
      - "dependencies"
      - "patch"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
