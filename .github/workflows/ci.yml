name: CI

on:
  push:
    branches: [main, release, rc]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches engines.node (>=20). The oldest supported version is the one
        # most likely to break, so it is not optional here.
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Includes the conformance scenarios via test/conformance.test.ts.
      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Thresholds live in vitest.config.ts and fail the run on their own.
      - name: Test with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  conformance:
    name: Conformance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Duplicates what `npm test` already asserts. The point is the report:
      # pass/fail per scenario per level, visible without opening a log, which
      # is what keeps the conformance claim checkable rather than assertable.
      - name: Conformance
        run: |
          {
            echo '## Conformance'
            echo
            echo '```'
            npm run conformance --silent 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: Package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Packs, audits the tarball's contents, installs it into a throwaway
      # project outside the repo, and exercises ESM import, CJS require and
      # type resolution under NodeNext in both module flavors. Catches
      # exports-map and packaging faults that no in-repo test can.
      - name: Verify the packed tarball
        run: npm run verify:package
