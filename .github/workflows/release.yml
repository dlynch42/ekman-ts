name: Release

# Two channels, one workflow file. Merges to `release` publish a release
# candidate on the `rc` dist-tag; merges to `main` publish stable on `latest`.
# They share a file because npm's trusted publisher configuration names a single
# workflow, so a second publishing workflow could not authenticate.
on:
  push:
    branches: [main, rc]
  workflow_dispatch:

concurrency:
  # Deliberately not keyed on the ref: a stable release and a release candidate
  # must never run at the same time, since both move tags and read the registry.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Gated behind the "release" GitHub Environment so an approval rule can be added.
    environment: release
    # Guards against a publish loop. `auto` appends `[skip ci]` to its own
    # "Bump version to:" and "Update CHANGELOG.md" commits, and GitHub honors
    # that natively by not triggering at all, so this condition is a second
    # layer rather than the mechanism.
    #
    # Deliberately not keyed on the commit author: `auto` takes its identity
    # from the `email` field in .autorc, which is the maintainer's own address,
    # so an author check cannot tell a release commit from a human one. Keying
    # on the author skips every release instead of just auto's own.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write # push the version bump commit + tag, create the GitHub release
      issues: write # auto comments on issues fixed by the release
      pull-requests: write # auto comments on released PRs
      id-token: write # OIDC for npm trusted publishing + build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # auto reads the whole history to find the previous release and the
          # PRs merged since it.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate runs here, before `auto` is invoked, on purpose. package.json
      # also carries it as `prepublishOnly` for anyone publishing from a laptop,
      # but a failure at that point would leave `auto` half-finished: version
      # bumped and tag created, nothing published.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Conformance
        run: npm run conformance

      - name: Build
        run: npm run build

      - name: Verify the packed tarball
        run: npm run verify:package

      # One step for both channels: `auto shipit` is context aware, publishing
      # a stable release from the base branch and a prerelease from a branch
      # listed in `prereleaseBranches`. `rc` is a real branch, so the version
      # identifier and the npm dist-tag it derives from the branch name are
      # simply `rc`.
      #
      # Publishes via npm trusted publishing (OIDC). No token is involved: the
      # package on npmjs.com carries a trusted publisher for this repository,
      # this workflow file and the `release` environment, and provenance is
      # attached automatically. Deliberately no NODE_AUTH_TOKEN, because
      # setup-node writes one into .npmrc and npm would prefer it over OIDC.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx auto shipit
